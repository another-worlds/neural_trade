# Level-1 screen campaign block (generated by make_specs.py; edit there). Pre-registered: the
# rules and the slices are fixed before any trial runs. docs/research/2026-09-29-screen-plan.md
schema_version: 1
base_config: ../../default.yaml
overrides:
  CSV_PATH: Bitcoin_BTCUSDT.csv
  N_FOLDS: 2
  VAL_FRACTION: 0.1
  CAL_FRACTION: 0.1
  MAX_SEQUENCE_COUNT: 4500
  FOLD_INDEX: -2
  BATCH_SIZE: 64
  TRAIN_METRICS_EVERY: 1
slices:
- '2020-03-12T23:00:00'
- '2021-05-19T23:00:00'
- '2023-07-15T00:00:00'
- '2024-12-05T00:00:00'
seeds:
- 0
- 1
run:
  calibrate: false
  epochs: 8
rules:
  finite: true
  max_nonfinite_grad_steps: 0
  max_clipped_share: 0.5
  clip_skip_epochs: 1
  min_train_loss_drop: 0.0
  max_term_share: 0.9
name: l1_C_physics
description: 'Block C: the physics terms (D-003): one-at-a-time ablations on a grid,
  and their weights jointly by LHS in [0.1x, 10x] (log), RHO_MAX in [0.5, 0.99].'
grid:
  axes:
    ABLATE_LAMBDAS:
    - []
    - - LAMBDA_T_PERP
    - - LAMBDA_CASIMIR
    - - LAMBDA_HD
    - - LAMBDA_IFE
    - - LAMBDA_VAC_OVERFLOW
sample:
  n: 30
  method: lhs
  seed: 3
  space:
    LAMBDA_T_PERP:
      low: 0.010000000000000002
      high: 1.0
      log: true
    LAMBDA_CASIMIR:
      low: 0.010000000000000002
      high: 1.0
      log: true
    LAMBDA_HD:
      low: 0.010000000000000002
      high: 1.0
      log: true
    LAMBDA_IFE:
      low: 0.010000000000000002
      high: 1.0
      log: true
    LAMBDA_VAC_OVERFLOW:
      low: 0.010000000000000002
      high: 1.0
      log: true
    RHO_MAX:
      low: 0.5
      high: 0.99
