# Zero-cost re-score (owner request 2026-09-29: "remove the commission completely").
# Every configuration of strategy_study_v1.yaml twice: at the scenario's default costs (13 bps per side) and with
# fee, half-spread and slippage all 0 (ids ending _0c). Descriptive: gross trading quality of the model; the
# default costs are unchanged.
#   neural-trade scenario rescore configs/scenarios/long_360d.yaml --study configs/strategy_studies/zero_cost_v1.yaml
