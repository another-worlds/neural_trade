# NT-104 (3) timing cells for runs/experiments/capacity_v1/SPEC.md "GPU-time estimate": two epochs on the
# largest judgement fold (-92), one cell per arm, to measure sec_per_step and per-epoch wall time.
# Its scores are discarded and never enter the verdict. Counts toward the 3 GPU-hour budget.
schema_version: 1
name: capacity_v1_timing
description: "NT-104 capacity A/B: timing only (2 epochs, fold -92), not scored."
base_config: ../default.yaml
overrides:
  CSV_PATH: D:/nt/neural_trade/Bitcoin_BTCUSDT.csv
  N_FOLDS: 100
  MAX_SEQUENCE_COUNT: 1500000
  VAL_FRACTION: 0.02
  CAL_FRACTION: 0.02
  SHUFFLE_BUFFER: 0
  BATCH_SIZE: 1024
  EPOCHS: 2
variants:
  control: {}
  gru_small: {MODEL_NAME: gru_small}
  linear_indicators: {MODEL_NAME: linear_indicators}
folds: [-92]
seeds: [0]
strategy: {name: calibrated_quantile, params: {}}
backtest: {}
run:
  calibrate: true
  save_artifacts: false
