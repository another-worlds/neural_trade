# NT-033 / VISION "The yardstick" (a): the same network with every indicator period frozen at the configured
# textbook starting values (MA 5/10/30, MACD 12/26/9 5/35/5 8/17/9, RSI 9/14/21, Bollinger 10/20/25, and the
# ten OHLCV families' defaults of configs/default.yaml). FREEZE_INDICATOR_PERIODS: no gradient or optimizer update
# on the period logits, no clip, and the per-window meta_adjust shift off, so every applied period in every
# window equals its configured value; the rest of the network (parameter count included) is the learned one's.
#
# The network's RSI periods are EMA spans (alpha = 2/(p+1)), not Wilder's n; the twin keeps them as
# configured (the same maths, frozen). The classic RSI rule of nt033_ta_rsi.yaml uses Wilder's smoothing.
#
# Same folds, seeds, strategy, costs and search space (the training hyperparameters) as nt033_learned.yaml.
#
#   neural-trade scenario plan configs/scenarios/nt033_frozen_twin.yaml
#   neural-trade sweep configs/scenarios/nt033_frozen_twin.yaml --mode optuna --n-trials 30   # GPU, NT-050
schema_version: 1
name: nt033_frozen_twin
description: The frozen-period twin of the learned network (periods held at the textbook values), reference setup.
base_config: ../default.yaml
overrides: {FREEZE_INDICATOR_PERIODS: true}   # in overrides, not a variant: `neural-trade sweep` refuses variants
variants:
  default: {}
folds: [-3, -2, -1]
seeds: [0, 1, 2]
strategy:
  name: calibrated_quantile
  params: {}
backtest: {}
run:
  calibrate: true
  save_artifacts: false
search:
  LR: {low: 0.0001, high: 0.01, log: true}
  BATCH_SIZE: {low: 128, high: 1024, log: true}
  LAMBDA_DIR: {low: 0.1, high: 3.0}
  LAMBDA_CRPS: {low: 0.1, high: 3.0}
