# H5 of the micro loop (D-041): the 4 h horizons were data-starved, not signal-free.
# H1/H4/H4b trained 160/240/320-bar horizons on ~10 days: about 40 effective non-overlapping outcomes.
# This cell trains the same horizon set on the 360-day block (about 1,600 effective outcomes), window 60,
# batch 2048 (no OOM at L60), layout of long_360d. One seed; quick sweep; ~25 GPU-min (estimate).
schema_version: 1
name: h4h_360d
description: "H5 (D-041): horizons 160/240/320 bars on the 360-day training block, LOOKBACK 60, one seed, quick sweep."
base_config: ../default.yaml
overrides:
  CSV_PATH: Bitcoin_BTCUSDT.csv
  N_FOLDS: 14
  MAX_SEQUENCE_COUNT: 698160
  VAL_FRACTION: 0.061877
  CAL_FRACTION: 0.061877
  SHUFFLE_BUFFER: 0
  BATCH_SIZE: 2048
  EPOCHS: 40
  HORIZON_STEPS: [160, 240, 320]
  EXTENDED_TREND_PERIODS: [160, 240, 320]
folds: [-2]
seeds: [0]
strategy: {name: calibrated_quantile, params: {}}
backtest: {}
run: {calibrate: true, save_artifacts: false}
