# H1 of the micro loop (D-041): do longer horizons carry an edge that survives costs?
# A 15-minute BTC move has sd about 21 bps against a 26 bps round trip; at 1-4 hours the move is 2-4x the
# cost. This quick sweep trains the default model on the micro layout (about 10 days of training, batch 2048:
# about 3-4 minutes per cell) with the horizons scaled up, everything else fixed.
# Micro layout on the long file: N_FOLDS 2, total 129,600 newest windows; fold -2 = train about 10 days,
# val and cal about 10 days each, dev out-of-sample block 30 days (2025-07 .. 2025-08); fold -1 (the newest
# 30 days) stays the untouched test fold (D-020).
schema_version: 1
name: micro_horizons
description: "H1 (D-041): horizons 10/15/20 vs 40/60/80 vs 160/240/320 bars on the micro layout, one seed, quick sweep."
base_config: ../default.yaml
overrides:
  CSV_PATH: Bitcoin_BTCUSDT.csv
  N_FOLDS: 2
  MAX_SEQUENCE_COUNT: 129600
  VAL_FRACTION: 0.1102
  CAL_FRACTION: 0.1102
  SHUFFLE_BUFFER: 0
  BATCH_SIZE: 2048
  EPOCHS: 30
variants:
  h_15m: {}                                                                  # control: 10/15/20 bars
  h_1h:  {HORIZON_STEPS: [40, 60, 80],    EXTENDED_TREND_PERIODS: [40, 60, 80]}
  h_4h:  {HORIZON_STEPS: [160, 240, 320], EXTENDED_TREND_PERIODS: [160, 240, 320]}
folds: [-2]
seeds: [0]
strategy:
  name: calibrated_quantile
  params: {}
backtest: {}
run:
  calibrate: true
  save_artifacts: false
