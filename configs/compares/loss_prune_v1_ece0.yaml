# NT-099 verdict 1 of 2: ece0 (LAMBDA_SOFT_ECE 0) vs control. See runs/experiments/loss_prune_v1/SPEC.md
# and docs/RUNBOOK.md "Paired comparator". Both configurations come from the same scenario
# (configs/scenarios/loss_prune_v1.yaml), so configuration_a/b select between its variants.
#
#   neural-trade compare configs/compares/loss_prune_v1_ece0.yaml --out runs/compares/loss_prune_v1_ece0
name: loss_prune_v1_ece0_vs_control
description: >
  Non-inferiority: does turning off the soft-ECE calibration term (A_losses.md section 7: an
  improper L1 kink that does not vanish at calibration and dominated the gradient direction in
  NT-037's CPU probe) cost more than 0.005 of h1 variance CRPSS against today's defaults, on 5
  judgement folds no earlier choice used?
scenario_a: loss_prune_v1
scenario_b: loss_prune_v1
configuration_a: ece0
configuration_b: control
metric: h1/variance/crpss
direction: higher_better
metric_kind: diff
min_effect: 0.005
non_inferiority_margin: 0.005
judgment_folds: [-39, -38, -37, -36, -35]
min_folds: 5
min_pairs: 5
pairs_planned: 10                       # 5 folds x 2 seeds, both configurations
alpha: 0.05
registered_utc: "2026-10-01T00:00:00Z"  # overridden by this file's git commit time once committed
                                         # and unedited (RUNBOOK "Paired comparator")
estimator: mean
guard_rails:
  - metric: h0/variance/crpss
    direction: higher_better
    max_degradation: 0.005
  - metric: h2/variance/crpss
    direction: higher_better
    max_degradation: 0.005
# Absolute (non-paired) guard-rails checked directly from each cell's own output in REPORT.md, not
# through this comparator (they are not A-vs-B degradations): conformal coverage90 in [0.85, 0.95]
# at every horizon for BOTH configurations; nonfinite_grad_steps == 0 for every cell (custom_model.py
# TrainMetrics); clipped_share (NT-037's grad_clip_steps_main / total steps) reported for both
# configurations once NT-037 lands, else the mean pre-clip global gradient norm per group instead
# (NT-098/NT-102 are not done yet: the norm is currently far above GRAD_CLIP_NORM on the new OHLCV
# default, so both configurations are expected to clip on most steps -- reported, not gated, until
# NT-102 re-chooses the clip).
# For --simulate: block_sd/seed_sd unmeasured on this layout; noise_sd left unset (no --simulate
# planned for this study; a run with --simulate before the real GPU time may set it from a dry run).
