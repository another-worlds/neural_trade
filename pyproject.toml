[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-trade"
description = "Multi-horizon BTC price, direction and uncertainty forecasting with learnable indicators"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dynamic = ["version"]
dependencies = [
    "numpy>=1.23,<1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.9",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "protobuf<3.20",
]

[project.optional-dependencies]
# TensorFlow is an extra so the package (config, metrics, calibration, backtesting) installs
# without it; training and serving need one of these. TF 2.10 is the last release with
# native Windows GPU support, which is why the stack is pinned around it.
tf = ["tensorflow==2.10.0"]
tf-cpu = ["tensorflow-cpu==2.10.1"]
viz = ["matplotlib>=3.7", "plotly>=5.24"]
notebooks = ["ipywidgets>=8.1", "ipython>=8", "jupyter>=1.0", "nbformat>=5.10", "nbconvert>=7"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "ruff>=0.6", "pre-commit>=3", "nbstripout>=0.7"]

[project.scripts]
neural-trade = "neural_trade.cli:main"

[tool.setuptools.dynamic]
version = { attr = "neural_trade.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neural_trade = ["py.typed", "configs/*.yaml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `from model import ...` / `from losses import ...` resolve from the repo root
# under a bare `pytest`; "src" is where the neural_trade package will live.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "tf: requires TensorFlow (auto-applied to any test module that imports tensorflow)",
    "slow: trains a model or otherwise takes more than ~30 s",
    "gpu: requires a GPU; never selected in CI",
    "data: requires the bundled binance_btcusdt_1min_ccxt.csv",
    "notebook: requires ipywidgets / IPython",
]
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow.*",
]

[tool.coverage.run]
source = ["neural_trade"]
omit = ["*/notebooks/*", "tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/neural_trade/compat.py" = ["F401"]   # the legacy re-export surface
