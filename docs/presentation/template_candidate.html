<style>
:root{
  --ground:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf1; --ink:#131b27; --ink-2:#3d4757; --muted:#667085;
  --line:#d3d9e2; --grid:#e3e7ed; --accent:#9a6200; --accent-soft:#f6e7c8;
  --good:#1d7a50; --bad:#b4235a; --h0:#3987e5; --h1:#d95926; --h2:#199e70; --neutral:#7b8594; --alt:#6a5acd;
  --shadow:0 1px 2px rgba(19,27,39,.06),0 8px 24px rgba(19,27,39,.06);
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0d131d; --surface:#151d2a; --surface-2:#1c2636; --ink:#e7ecf3; --ink-2:#c3cbd8; --muted:#95a1b3;
  --line:#2a3547; --grid:#212b3b; --accent:#e3aa3c; --accent-soft:#3a2d12; --good:#46b988; --bad:#f06292; --neutral:#8c97a8; --alt:#a99cf0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0d131d; --surface:#151d2a; --surface-2:#1c2636; --ink:#e7ecf3; --ink-2:#c3cbd8; --muted:#95a1b3;
  --line:#2a3547; --grid:#212b3b; --accent:#e3aa3c; --accent-soft:#3a2d12; --good:#46b988; --bad:#f06292; --neutral:#8c97a8; --alt:#a99cf0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--ground);color:var(--ink);font:16px/1.6 var(--body);margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:0 96px}
@media (min-width:1180px){.wrap{padding-left:240px;max-width:1440px}}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(38px,6vw,78px);line-height:1.02;font-weight:750}
h2{font-size:clamp(27px,3.4vw,42px);line-height:1.1;font-weight:700}
h3{font-size:19px;line-height:1.3;font-weight:650}
p{margin:0}
.lede{font-size:clamp(17px,1.6vw,20px);color:var(--ink-2);max-width:68ch}
.muted{color:var(--muted)} .mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.rail{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;width:212px;padding:28px 18px;border-right:1px solid var(--line);background:var(--ground);display:none;flex-direction:column;gap:4px;z-index:5}
@media (min-width:1180px){.rail{display:flex}}
.rail .brand{font:700 15px/1.2 var(--display);margin-bottom:18px}
.rail .brand span{display:block;font:400 12px/1.4 var(--mono);color:var(--muted);margin-top:4px}
.rail a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);padding:6px 8px;border-radius:6px;font-size:14px}
.rail a b{font:500 11px var(--mono);min-width:18px}
.rail a:hover{color:var(--ink);background:var(--surface-2)}
.rail a.on{color:var(--ink);background:var(--surface)} .rail a.on b{color:var(--accent)}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:10px 16px;display:flex;gap:6px}
@media (min-width:1180px){.topnav{display:none}}
.topnav a{font-size:13px;text-decoration:none;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.topnav a.on{color:var(--ink);border-color:var(--accent)}
section.ch{padding-top:84px;display:flex;flex-direction:column;gap:26px;scroll-margin-top:40px}
.head{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.panel .cap{font-size:14px;color:var(--ink-2)} .panel .cap b{color:var(--ink)}
.chart{width:100%;min-height:320px} .chart.mid{min-height:390px} .chart.tall{min-height:680px}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--ink-2);max-width:80ch} .note b{color:var(--ink)}
.hero{padding-top:56px;display:grid;gap:32px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font:600 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v.good{color:var(--good)} .kpi .v.bad{color:var(--bad)} .kpi .v.lead{color:var(--accent)}
.pipe{display:flex;flex-wrap:wrap;gap:8px}
.stage{flex:1 1 150px;min-width:130px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.stage:hover{border-color:var(--accent)}
.stage .n{font:500 11px var(--mono);color:var(--muted)} .stage .t{font:650 15px/1.2 var(--display)} .stage .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.stage.on{border-color:var(--accent);background:var(--accent-soft)}
.stageDetail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:var(--ink-2)}
.stageDetail b{color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--ink-2);padding:6px 12px;font:13px var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--ground)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.lead td{background:var(--accent-soft)}
.up{color:var(--good)} .dn{color:var(--bad)}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.foot{margin-top:72px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}
.foot code{font-family:var(--mono);font-size:12px}
.corrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
</style>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const pct=(x,d=1)=>x==null?'–':(x>0?'+':'')+(100*x).toFixed(d)+'%';
const pct0=(x,d=1)=>x==null?'–':(100*x).toFixed(d)+'%';
const fmt=(x,d=3)=>x==null?'–':Number(x).toFixed(d);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el=id=>document.getElementById(id);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function T(){ return {ink:css('--ink'),ink2:css('--ink-2'),muted:css('--muted'),grid:css('--grid'),line:css('--line'),accent:css('--accent'),good:css('--good'),bad:css('--bad'),
  neutral:css('--neutral'),alt:css('--alt'),surface:css('--surface'),h0:css('--h0'),h1:css('--h1'),h2:css('--h2'),mono:"IBM Plex Mono, Consolas, monospace",body:"IBM Plex Sans, system-ui, sans-serif"}; }
function L(extra){
  const t=T(); extra=extra||{};
  const ax={gridcolor:t.grid,zerolinecolor:t.line,linecolor:t.line,tickfont:{family:t.mono,size:11,color:t.muted},title:{font:{size:12,color:t.muted}},automargin:true};
  const base={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:t.body,color:t.ink2,size:12},margin:{l:56,r:16,t:44,b:44},hovermode:'closest',
    legend:{orientation:'h',x:0,y:1.02,yanchor:'bottom',font:{size:12,color:t.ink2}},hoverlabel:{font:{family:t.mono,size:12}},xaxis:{...ax},yaxis:{...ax}};
  const out={...base,...extra};
  out.legend={...base.legend,...(extra.legend||{})};
  if (extra.margin) out.margin={...base.margin,...extra.margin};
  for (const k of Object.keys(extra)) if (/^[xy]axis\d*$/.test(k)) out[k]={...ax,...extra[k]};
  return out;
}
const CFG={displaylogo:false,responsive:true,modeBarButtonsToRemove:['lasso2d','select2d','autoScale2d','toggleSpikelines'],displayModeBar:'hover'};
const plot=(id,data,layout)=>{ const e=el(id); if(e) Plotly.react(e,data,L(layout),CFG); };
const segHandler=(id,fn)=>el(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; el(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); fn(b.dataset.v); });
const kpis=list=>`<div class="kpis">${list.map(k=>`<div class="kpi"><div class="v ${k[2]||''}">${k[0]}</div><div class="k">${k[1]}</div></div>`).join('')}</div>`;
const panel=(cap,id,cls='',extra='')=>`<div class="panel">${extra}<div class="cap">${cap}</div><div id="${id}" class="chart ${cls}"></div></div>`;
const chapter=(id,eyebrow,h,lede,body)=>`<section class="ch" id="${id}"><div class="head"><p class="eyebrow">${eyebrow}</p><h2>${h}</h2>${lede?`<p class="lede">${lede}</p>`:''}</div>${body}</section>`;

/* shared: a price + trades + equity + drawdown panel */
function drawTradePanel(id, V, opts){
  const t=T(), TD=V.trades, n=TD.side.length, which=opts.trades||'all';
  const idx=[...Array(n).keys()].filter(i=>which==='all'||(which==='long'&&TD.side[i]>0)||(which==='short'&&TD.side[i]<0));
  const mk=win=>{ const ii=idx.filter(i=>(TD.ret_bps[i]>0)===win); return {type:'scatter',mode:'markers',xaxis:'x',yaxis:'y',name:win?'winning trade':'losing trade',
    x:ii.map(i=>TD.t_entry[i]),y:ii.map(i=>TD.px[i]),marker:{size:opts.msize||6,symbol:ii.map(i=>TD.side[i]>0?(win?'triangle-up':'triangle-up-open'):(win?'triangle-down':'triangle-down-open')),color:win?t.good:t.bad,line:{width:1,color:win?t.good:t.bad}},
    text:ii.map(i=>`${TD.side[i]>0?'LONG':'SHORT'} ${TD.t_entry[i]} → ${TD.t_exit[i]}<br>${TD.ret_bps[i]>0?'+':''}${TD.ret_bps[i]} bps · ${TD.bars[i]} bars · exit ${TD.reason[i]}`),hovertemplate:'%{text}<extra></extra>'}; };
  const data=[{type:'scatter',mode:'lines',name:'BTC/USDT close',x:V.t,y:V.close,line:{color:t.ink2,width:1},xaxis:'x',yaxis:'y',hovertemplate:'%{x}<br>$%{y:,.0f}<extra></extra>'}];
  (opts.extraPrice||[]).forEach(tr=>data.push({...tr,xaxis:'x',yaxis:'y'}));
  data.push(mk(true),mk(false),
    {type:'scatter',mode:'lines',name:opts.eqName||'equity',x:V.t,y:V.equity,line:{color:t.accent,width:2.2},xaxis:'x',yaxis:'y2',hovertemplate:'$%{y:,.0f}<extra></extra>'},
    {type:'scatter',mode:'lines',name:'buy-and-hold',x:V.t,y:V.bh,line:{color:t.neutral,width:1.4,dash:'dot'},xaxis:'x',yaxis:'y2',hovertemplate:'B&H $%{y:,.0f}<extra></extra>'},
    {type:'scatter',mode:'lines',name:'drawdown',x:V.t,y:V.dd.map(v=>-v),fill:'tozeroy',line:{color:t.bad,width:1},fillcolor:'rgba(180,35,90,0.18)',xaxis:'x',yaxis:'y3',hovertemplate:'drawdown %{y:.2%}<extra></extra>'});
  const shapes=opts.ddLine?[{type:'line',xref:'paper',x0:0,x1:1,yref:'y3',y0:-opts.ddLine,y1:-opts.ddLine,line:{color:t.bad,dash:'dash',width:1}}]:[];
  plot(id,data,{margin:{l:64,r:16,t:44,b:40},xaxis:{type:'date'},yaxis:{domain:[0.52,1],title:{text:'price ($)'},tickformat:',.0f'},
    yaxis2:{domain:[0.2,0.48],title:{text:'equity ($)'},tickformat:',.0f'},yaxis3:{domain:[0,0.16],title:{text:'drawdown'},tickformat:'.0%'},shapes});
}
function nullPanel(id, R, ret, bh, label){
  const t=T();
  plot(id,[
    {type:'scatter',x:[R.random_p05_total_return,R.random_p95_total_return],y:[0,0],mode:'lines',line:{color:t.neutral,width:22},opacity:0.35,name:'random: 5th–95th percentile',hoverinfo:'skip'},
    {type:'scatter',x:[ret],y:[0],mode:'markers+text',marker:{size:18,color:t.accent,symbol:'diamond'},text:[`${label} ${pct(ret)}`],textposition:'top center',textfont:{family:t.mono,color:t.ink},name:label,hovertemplate:'%{x:.1%}<extra></extra>'},
    {type:'scatter',x:[bh],y:[0],mode:'markers+text',marker:{size:12,color:t.bad,symbol:'x'},text:['buy-and-hold'],textposition:'bottom center',textfont:{family:t.mono,color:t.ink2},name:'buy-and-hold',hovertemplate:'%{x:.1%}<extra></extra>'}],
    {xaxis:{tickformat:'.0%',title:{text:'return on the block'},range:[Math.min(R.random_p05_total_return,bh,ret)-0.04,Math.max(R.random_p95_total_return,bh,ret)+0.05]},yaxis:{visible:false,range:[-1,1]}});
}
function nav(CH, brand){
  el('rail').innerHTML=`<div class="brand">neural_trade<span>${brand}</span></div>`+CH.map((c,i)=>`<a href="#${c[0]}" data-c="${c[0]}"><b>${String(i).padStart(2,'0')}</b>${c[1]}</a>`).join('');
  el('topnav').innerHTML=CH.map(c=>`<a href="#${c[0]}" data-c="${c[0]}">${c[1]}</a>`).join('');
  const secs=CH.map(c=>el(c[0]));
  const cur=()=>{ let b=0; secs.forEach((s,i)=>{ if(s&&s.getBoundingClientRect().top<window.innerHeight*0.35) b=i; }); return b; };
  const mark=()=>{ const i=cur(); document.querySelectorAll('[data-c]').forEach(a=>a.classList.toggle('on',a.dataset.c===CH[i][0])); };
  window.addEventListener('scroll',mark,{passive:true}); mark();
  document.addEventListener('keydown',e=>{ if(e.target.closest('input,select,textarea')) return; const i=cur();
    if(e.key==='j'){ secs[Math.min(i+1,secs.length-1)].scrollIntoView(); } if(e.key==='k'){ secs[Math.max(i-1,0)].scrollIntoView(); } });
}
function stages(id, list){
  el(id).innerHTML=`<div class="pipe">${list.map((s,i)=>`<button class="stage" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${s[0]}</span><span class="s">${s[1]}</span></button>`).join('')}</div><div class="stageDetail" id="${id}D"></div>`;
  const show=i=>{ el(id).querySelectorAll('.stage').forEach(b=>b.classList.toggle('on',+b.dataset.i===i)); el(id+'D').innerHTML=list[i][2]; };
  el(id).addEventListener('click',e=>{ const b=e.target.closest('.stage'); if(b) show(+b.dataset.i); }); show(0);
}

/* =============================== #3 · SEED ENSEMBLE =============================== */
function ensemblePage(){
  const F=D.folds, M=D.manifest, fk=['f-3','f-2'];
  const st={fold:'f-2',trades:'all'};
  const CH=[['e0','Seed ensemble C3'],['e1','How it works'],['e2','The members'],['e3','What averaging does'],['e4','Backtest'],['e5','Sizing'],['e6','Verdict']];
  const cRet=fk.map(f=>F[f].c3.ret), cDD=fk.map(f=>F[f].c3.dd);
  el('app').innerHTML = `
  <header class="hero" id="e0"><div class="head" style="gap:20px;max-width:980px">
    <p class="eyebrow">neural_trade · candidate #3 · BTC/USDT 1-minute · zero trading costs</p>
    <h1>C3: three seeds, one position</h1>
    <p class="lede">Three copies of the 360-day model, trained with different random seeds, are averaged into one forecast. The default strategy trades it at 70% position size. It is the only candidate whose drawdown stays under 5% on both evaluation blocks: ${pct0(cDD[0])} and ${pct0(cDD[1])}. It earns ${pct(cRet[0])} and ${pct(cRet[1])}. Averaging did not raise the win share; the smaller position did the work.</p></div>
    ${kpis([[pct(M.mean_return),'mean return per block','lead'],[M.profitable_cells,'blocks profitable','good'],[pct0(M.mean_win_share),'winning trades',''],[pct0(M.max_drawdown),'worst drawdown','good'],
      [pct(F['f-3'].c3.ret),'fold −3 (B&H '+pct(F['f-3'].c3.bh)+')',''],[pct(F['f-2'].c3.ret),'fold −2 (B&H '+pct(F['f-2'].c3.bh)+')',''],[(F['f-3'].c3.trades+F['f-2'].c3.trades).toLocaleString('en'),'trades in 2 blocks',''],['0.7','position size','']])}
    ${panel('<b>Equity of $10,000 on both evaluation blocks</b> (days into the block). Gold = C3, dotted = buy-and-hold on the same block.','heroEq')}
  </header>
  ${chapter('e1','Chapter 1 · How it works','From three forecasts to one trade','Click a stage.',`<div id="stg"></div>`)}
  ${chapter('e2','Chapter 2 · The members','Six models, two blocks, three seeds each','The members are the six 360-day models of the stability check: folds −3 and −2 × seeds 0–2. Same data, same code, same settings; only the random seed differs. They still train differently.',
    `<div class="grid2">${panel('<b>Validation loss of each member.</b> Stars mark the served epoch (best validation loss). Fold −3 in blue, fold −2 in gold.','members')}
      ${panel('<b>Direction AUC on the dev block</b>, per seed and for the ensemble (diamond). Averaging lands the ensemble near the seeds\' level, not above it.','aucs','','<div class="ctrl"><div class="seg" id="aucSeg"><button data-v="f-3">fold −3</button><button data-v="f-2" class="on">fold −2</button></div></div>')}</div>
      <div class="panel"><div class="cap"><b>Fit of each member</b> (dev block, h0 / h1 / h2). The logistic column is a regression on three lagged returns; CRPSS is the variance forecast's skill against a constant variance.</div><div class="tbl"><table id="fitTbl"></table></div></div>`)}
  ${chapter('e3','Chapter 3 · What averaging does','The seeds barely agree','The traded signal is the confidence-weighted P(up). If the seeds shared one real signal, their signals would be strongly correlated and averaging would clean it. They are almost uncorrelated. Each seed\'s signal is mostly its own noise around a very small common part, and averaging keeps the small common part.',
    `<div class="ctrl"><div class="seg" id="corrSeg"><button data-v="f-3">fold −3</button><button data-v="f-2" class="on">fold −2</button></div></div>
     <div class="corrgrid">${panel('<b>Correlation of the traded signal</b> between seeds and the ensemble, bar by bar on the dev block.','corr')}
      ${panel('<b>Distribution of the traded signal.</b> The ensemble (gold) is narrower: averaging independent noise shrinks it toward 0.5.','whist')}
      ${panel('<b>Shared entries.</b> Share of the ensemble\'s trades that a single seed also opened within ±2 bars. The ensemble trades different moments than any member.','overlap')}</div>
     <div class="note" id="ensNote"></div>`)}
  ${chapter('e4','Chapter 4 · Backtest','Two blocks, two different markets','Fold −3 was a rising market (buy-and-hold ' + pct(F['f-3'].c3.bh) + '), fold −2 a falling one (' + pct(F['f-2'].c3.bh) + '). The strategy trades both directions, so the market\'s drift barely matters.',
    `<div class="ctrl"><div class="seg" id="foldSeg"><button data-v="f-3">fold −3</button><button data-v="f-2" class="on">fold −2</button></div><div class="seg" id="trSeg"><button data-v="all" class="on">all trades</button><button data-v="long">longs</button><button data-v="short">shorts</button><button data-v="none">no markers</button></div></div>
     ${panel('<b>Price, trades, equity and drawdown.</b> ▲ long, ▼ short, filled = winning. The dashed line in the drawdown panel is the 5% limit.','bt','tall','')}
     <div class="grid2">${panel('<b>Ensemble against its own members</b> on this block, all at position 0.7: return, win share and drawdown.','vsSeeds')}
      ${panel('<b>Against luck:</b> 100 random strategies with the same trade frequency (5th–95th percentile) against C3.','nullc')}</div>`)}
  ${chapter('e5','Chapter 5 · Sizing','Drawdown is a position-size choice','Return and drawdown both scale almost linearly with position size, and the win share does not change. The 0.7 in C3 was chosen as the largest size that keeps both dev blocks under 5% drawdown. That is a choice made on dev data, not a forecast.',
    `<div class="grid2">${panel('<b>Return and worst drawdown against position size</b>, both blocks. The dashed line is the 5% drawdown limit.','sizes')}

      {type:'scatter',mode:'lines',name:'model σ (bps)',x:G.t,y:G.sigma_model_bps,line:{color:t.neutral,width:1},xaxis:'x',yaxis:'y2',hovertemplate:'model σ %{y:.2f} bps<extra></extra>'},
      {type:'scatter',mode:'lines',name:'EWMA σ (bps)',x:G.t,y:G.sigma_ewma_bps,line:{color:t.alt,width:1},opacity:0.7,xaxis:'x',yaxis:'y2',hovertemplate:'EWMA σ %{y:.2f} bps<extra></extra>'},
      {type:'scatter',mode:'lines',name:'gate',x:[G.t[0],G.t[G.t.length-1]],y:[gate,gate],line:{color:t.accent,dash:'dash',width:2},xaxis:'x',yaxis:'y2',hoverinfo:'skip'}],
      {margin:{l:64,r:16,t:44,b:40},xaxis:{type:'date'},yaxis:{domain:[0.4,1],title:{text:'price ($)'},tickformat:',.0f'},yaxis2:{domain:[0,0.32],title:{text:'σ of the 20-min move (bps)'}}});
    plot('train',C.flatMap((c,i)=>{ const e=c.training.epoch.map(v=>v+1), s=c.training.served_epoch;
      return [{type:'scatter',mode:'lines',name:`seed ${i}`,x:e,y:c.training.val_loss,line:{color:t.accent,dash:['solid','dash','dot'][i]},legendgroup:'s'+i,hovertemplate:`seed ${i} epoch %{x}: %{y:.3f}<extra></extra>`},
              {type:'scatter',mode:'markers',x:[s],y:[c.training.val_loss[s-1]],marker:{symbol:'star',size:11,color:t.accent},showlegend:false,legendgroup:'s'+i,hovertemplate:`served epoch ${s}<extra></extra>`}]; }),
      {xaxis:{title:{text:'epoch'}},yaxis:{title:{text:'validation loss'}}});
    const sc=c0.sigma_cal, mx=Math.max(...sc.map(b=>Math.max(b.sigma,b.rms)))*1.08;
    plot('sigcal',[{type:'scatter',mode:'lines',x:[0,mx],y:[0,mx],line:{color:t.muted,dash:'dot'},name:'perfect',hoverinfo:'skip'},
      {type:'scatter',mode:'lines+markers',name:'h2 deciles',x:sc.map(b=>b.sigma),y:sc.map(b=>b.rms),line:{color:t.h2},marker:{size:9,color:t.h2},hovertemplate:'predicted $%{x:.0f} · realised $%{y:.0f}<extra></extra>'}],
      {xaxis:{title:{text:'predicted σ of the 20-min move ($)'},range:[0,mx]},yaxis:{title:{text:'realised RMS move ($)'},range:[0,mx]}});
    let rows='<tr><th>model</th><th>AUC h0 / h1 / h2</th><th>logistic</th><th>CRPSS h2</th><th>coverage h2</th><th>σ² vs err² h2</th></tr>';
    C.forEach((c,i)=>{ const m=c.fit; rows+=`<tr><td>seed ${i}</td><td>${fmt(m.h0.auc)} / ${fmt(m.h1.auc)} / ${fmt(m.h2.auc)}</td><td>${fmt(m.h0.auc_logreg)} / ${fmt(m.h1.auc_logreg)} / ${fmt(m.h2.auc_logreg)}</td><td>${pct0(m.h2.crpss)}</td><td>${pct0(m.h2.coverage90)}</td><td>${fmt(m.h2.spearman,2)}</td></tr>`; });
    el('fitTbl').innerHTML=rows;
    drawCell();
    const gl=['no gate','EWMA σ (model-free)','network σ, seed 0','network σ, seed 1','network σ, seed 2','Bollinger + network σ (seed 0)'];
    const gv=[ng,ew,...C.map(c=>c.variants['model|0.8']),C[0].variants['bollinger|0.8']];
    plot('gates',[{type:'bar',x:gl,y:gv.map(v=>v.ret),marker:{color:[t.neutral,t.alt,t.accent,t.accent,t.accent,t.h1]},text:gv.map(v=>`${pct(v.ret)} · ${v.trades} tr · ${pct0(v.win,0)} wins`),textposition:'outside',cliponaxis:false,textfont:{family:t.mono,size:11,color:t.ink2},hovertemplate:'%{x}<br>%{text}<extra></extra>'}],
      {showlegend:false,margin:{t:24,b:90},yaxis:{tickformat:'.0%',title:{text:'return on the block'}},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:0,y1:0,line:{color:t.muted,dash:'dot'}}]});
    const qs=[0.5,0.6,0.7,0.8,0.9,0.95];
    plot('qcurve',[...C.map((c,i)=>({type:'scatter',mode:'lines+markers',name:`network σ, seed ${i}`,x:qs,y:qs.map(q=>c.variants[`model|${q}`].ret),line:{color:t.accent,dash:['solid','dash','dot'][i]},hovertemplate:`seed ${i} q %{x}: %{y:.1%}<extra></extra>`})),
      {type:'scatter',mode:'lines+markers',name:'EWMA σ',x:qs,y:qs.map(q=>C[0].variants[`ewma|${q}`].ret),line:{color:t.alt,width:2.6},hovertemplate:'EWMA q %{x}: %{y:.1%}<extra></extra>'}],
      {xaxis:{title:{text:'gate quantile (calibration block)'}},yaxis:{tickformat:'.0%',title:{text:'return'}},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:0,y1:0,line:{color:t.muted,dash:'dot'}}]});
    plot('costc',C.map((c,i)=>{ const k=Object.keys(c.cost_curve).map(Number).sort((a,b)=>a-b);
      return {type:'scatter',mode:'lines+markers',name:`seed ${i}`,x:k,y:k.map(v=>c.cost_curve[String(v)]),line:{color:t.accent,dash:['solid','dash','dot'][i]},hovertemplate:`seed ${i}: %{y:.1%} at %{x} bps<extra></extra>`}; }),
      {xaxis:{title:{text:'round-trip cost (bps)'}},yaxis:{tickformat:'.0%',title:{text:'return'}},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:0,y1:0,line:{color:t.muted,dash:'dot'}}]});
  }
  function drawCell(){ const t=T(), c=C[st.cell], V=c.view, TD=V.trades;
    drawTradePanel('bt',V,{trades:st.trades,eqName:`seed ${st.cell} equity`,msize:9});
    const w=TD.ret_bps.filter(v=>v>0), l=TD.ret_bps.filter(v=>v<=0);
    plot('thist',[{type:'histogram',x:w,name:`winning (${w.length})`,marker:{color:t.good,opacity:0.75},xbins:{size:5}},{type:'histogram',x:l,name:`losing (${l.length})`,marker:{color:t.bad,opacity:0.75},xbins:{size:5}}],
      {barmode:'overlay',xaxis:{title:{text:'trade return (bps)'}},yaxis:{title:{text:'trades'}}});
    plot('hold',[{type:'scatter',mode:'markers',x:TD.bars,y:TD.ret_bps,marker:{size:8,color:TD.ret_bps.map(v=>v>0?t.good:t.bad),symbol:TD.side.map(s=>s>0?'triangle-up':'triangle-down')},text:TD.t_entry,hovertemplate:'%{text}<br>%{x} bars · %{y:+.1f} bps<extra></extra>',name:'trades'}],
      {showlegend:false,xaxis:{title:{text:'bars held'}},yaxis:{title:{text:'return (bps)'}},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:0,y1:0,line:{color:t.muted,dash:'dot'}}]});
    nullPanel('nullc',c.random_null,c.summary.ret,c.summary.bh,`seed ${st.cell}`); }
  segHandler('cellSeg',v=>{st.cell=+v;drawCell();}); segHandler('trSeg',v=>{st.trades=v;drawCell();});
  el('verdict').innerHTML=[
    ['What it is','A classic trend-following rule with a volatility filter. It makes money on this block because trends that start in high-volatility minutes tend to run, and the rule holds them to the opposite cross.'],
    ['What the network adds',`Little. Its volatility forecast is a working gate (no gate: ${pct(ng.ret)}), but an EWMA of past returns does the same job, better here (${pct(ew.ret)} against ${pct(mean(rets))}). The direction heads play no part.`],
    ['Why it looks robust','Wins are about twice the size of losses, so a 40% win share is enough. It trades 3–5 times a day and needs costs below a few bps, not below 1 bps like C1.'],
    ['Limits',`One block (fold −2, ${c0.view.first.slice(0,10)} → ${c0.view.last.slice(0,10)}), 83–151 trades per model: a 40% win share is known only to about ±8–11 points. The three models share the block, so they are not three independent tests. The EWMA variant is a single rule on the same block. Zero costs; the test fold is untouched.`]]
    .map(v=>`<div class="panel"><h3>${v[0]}</h3><p class="muted">${v[1]}</p></div>`).join('');
  return drawAll;
}

const draw = D.subject==='ensemble' ? ensemblePage() : taPage();
const renderAll=()=>draw();
if (window.Plotly) renderAll(); else window.addEventListener('load',renderAll);
const mq=window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener&&mq.addEventListener('change',renderAll);
new MutationObserver(renderAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
