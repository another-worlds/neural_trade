name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  slow-and-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      NEURAL_TRADE_FORCE_CPU: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Slow and data-backed tests
        run: pytest -m "slow or data" --timeout=3600

      # Phase C4 adds here:
      #   python scripts/ablate.py configs/ablation_physics.yaml --scale smoke --only all_on,all_off
      # and uploads runs/**/eval_report.json + report.md as artifacts.
