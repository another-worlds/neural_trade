name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.6.9
      - name: Ruff (package and scripts)
        run: ruff check src scripts

  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONHASHSEED: "0"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Unit tests (CPU, no slow/gpu)
        run: pytest -m "not gpu and not slow" --timeout=600 --cov=neural_trade --cov-report=xml --cov-report=json:coverage.json --cov-report=term

      - name: Coverage gates
        run: python scripts/check_coverage.py coverage.json

      - name: CLI smoke (train one epoch on a slice, then predict)
        run: |
          head -n 4000 binance_btcusdt_1min_ccxt.csv > slice.csv
          RUN=$(neural-trade train --csv slice.csv --epochs 1 --no-calibrate --runs-dir ci_runs \
                --set MAX_SEQUENCE_COUNT=2000 --set "CALLBACKS=[early_stopping, model_checkpoint]" | tail -n 1)
          neural-trade predict --artifacts "$RUN/artifacts" --csv slice.csv --last

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
